# Atiende - Docker Compose
#
# Postgres dedicado con pgvector + Redis compartido vía microservices-network.
#
# Uso:
#   docker compose up -d     # levanta postgres (pgvector) + atiende (hot-reload)
#   docker compose down      # detiene todo
#   docker compose down -v   # detiene y borra datos de postgres
#
# ⚠️ El Redis se comparte con otros proyectos en microservices-network.
#    Debe estar corriendo antes de iniciar atiende.

services:
  # ─────────────────────────────────────────
  # PostgreSQL 16 + pgvector (exclusivo atiende)
  # ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atiende-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atiende
      POSTGRES_PASSWORD: atiende_dev
      POSTGRES_DB: atiende
    ports:
      - "${PGVECTOR_PORT:-5433}:5432"
    volumes:
      - atiende_pgdata:/var/lib/postgresql/data
      - ./prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atiende -d atiende"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ─────────────────────────────────────────
  # Atiende app
  # ─────────────────────────────────────────
  atiende:
    build:
      context: .
      target: development
    container_name: atiende-app
    restart: unless-stopped
    ports:
      - "${PORT:-3013}:3013"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3013}
      DATABASE_URL: postgresql://atiende:atiende_dev@atiende-postgres:5432/atiende?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PREFIX: atiende:dev
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network

volumes:
  atiende_pgdata:
    name: atiende_pgdata

networks:
  microservices-network:
    external: true
